global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'gateway'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'dispatch'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'archiver'
    static_configs:
      - targets: ['host.docker.internal:9090']

  - job_name: 'baseline'
    static_configs:
      - targets: ['host.docker.internal:8089']

